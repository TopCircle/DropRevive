      <rect x="148" y="104" width="76" height="140" rx="12"/>
      <line x1="179" y1="224" x2="193" y2="224" stroke-width="10"/>
      <rect x="194" y="312" width="154" height="88" rx="4"/>
      <line x1="172" y1="425" x2="370" y2="425"/>
    </g>
    <path d="M258 234 C232 234 214 248 209 270" fill="none" stroke="#1a73e8" stroke-width="12" stroke-linecap="round"/>
    <path d="M191 266 L208 292 L226 268 Z" fill="#1a73e8" stroke="#1a73e8" stroke-width="4" stroke-linejoin="round"/>
